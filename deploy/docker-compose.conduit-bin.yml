services:
  pizza_store:
    container_name: pizza_store
    build:
      context: ..
      dockerfile: services/products-service/Dockerfile
    volumes:
      - /tmp/app:/var/log/app
    ports:
      - '8080:8080'
    env_file:
      - ../.env
      - ../.env.docker
    depends_on:
      pizza_store_postgres:
        condition: service_healthy
